spring.application.name=api-gateway
server.port=8080

spring.cloud.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=menu-service
spring.cloud.gateway.routes[1].uri=lb://menu-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/menu/**

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://payment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/payment/**

spring.cloud.gateway.routes[3].id=qr-service
spring.cloud.gateway.routes[3].uri=lb://qr-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/qr/**

spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=lb://order-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/